<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secret은 Windows Credential Manager에만 저장되고 저장 후 다시 표시되지 않는다는 보안 안내">
  <title>자격증명 보안 안내</title>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1D1D26"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="810" fill="#F5F7FA"/>

  <rect x="0" y="0" width="1440" height="56" fill="#FFD23F" opacity="0.9"/>
  <text x="720.0" y="36" font-size="22" font-weight="800" text-anchor="middle" fill="#1D1D26">절차 안내 예시 — 판매자센터 화면은 변경될 수 있습니다</text>

  
  <text x="120" y="122" font-size="30" font-weight="800" fill="#1D1D26">자격증명 보안 안내</text>

  
  
    <g transform="translate(720.0,260)">
      <rect x="-24" y="-4" width="48" height="40" rx="6" fill="#6C5CE7"/>
      <path d="M -14 -4 L -14 -20 A 14 14 0 0 1 14 -20 L 14 -4" fill="none" stroke="#6C5CE7" stroke-width="8"/>
      <circle cx="0" cy="16" r="5" fill="#F5F7FA"/>
    </g>
    
  <text x="720.0" y="360" font-size="26" text-anchor="middle" fill="#1D1D26" font-weight="800">Secret은 저장 후 다시 표시되지 않습니다</text>
  <text x="720.0" y="410" font-size="18" text-anchor="middle" fill="#1D1D26">HOMEZ는 Access Key/Secret Key/Client Secret을 Windows Credential Manager에만 저장합니다.</text>
  <text x="720.0" y="440" font-size="18" text-anchor="middle" fill="#1D1D26">데이터베이스, 로그, 화면 응답 어디에도 평문으로 남지 않습니다.</text>


  <rect x="0" y="760" width="1440" height="50" fill="#1D1D26"/>
  <text x="24" y="792" font-size="16" fill="#FFFFFF" font-weight="700">HOMEZ</text>
  <text x="1416" y="792" font-size="14" fill="#B8BEC8" text-anchor="end">공식 API 자격증명만 사용 — 로그인 비밀번호를 입력하지 않습니다</text>
</svg>