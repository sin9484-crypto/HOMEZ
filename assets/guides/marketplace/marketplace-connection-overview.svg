<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="브라우저에서 판매자센터로 이동해 API 키를 발급받고 HOMEZ에 입력하는 전체 흐름 다이어그램">
