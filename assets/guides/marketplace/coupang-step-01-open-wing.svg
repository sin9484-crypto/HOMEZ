    <g transform="translate(360,220)">
      <rect x="0" y="0" width="300" height="190" rx="10" fill="#FFFFFF" stroke="#1D1D26" stroke-width="2"/>
      <rect x="0" y="0" width="300" height="28" rx="10" fill="#F5F7FA" stroke="#1D1D26" stroke-width="2"/>
      <circle cx="18" cy="14" r="5" fill="#FF6BC1"/>
