<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HOMEZ 네이버 연결 화면에 Client ID/Client Secret을 입력하는 절차 안내">
  <title>HOMEZ에 연결 정보 입력</title>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1D1D26"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="810" fill="#F5F7FA"/>

  <rect x="0" y="0" width="1440" height="56" fill="#FFD23F" opacity="0.9"/>
  <text x="720.0" y="36" font-size="22" font-weight="800" text-anchor="middle" fill="#1D1D26">절차 안내 예시 — 판매자센터 화면은 변경될 수 있습니다</text>

  
    <g transform="translate(70,110)">
      <circle cx="0" cy="0" r="30" fill="#6C5CE7"/>
      <text x="0" y="10" font-size="30" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text>
    </g>
    
  <text x="120" y="122" font-size="30" font-weight="800" fill="#1D1D26">HOMEZ에 연결 정보 입력</text>

  
  
    <g transform="translate(300,260) scale(1.1)">
      <circle cx="0" cy="0" r="46" fill="#00D4C8" opacity="0.15"/>
      <path d="M -30 6 L 0 -28 L 30 6 L 30 34 L -30 34 Z" fill="#1D1D26"/>
      <path d="M -34 8 L 0 -34 L 34 8" stroke="#00D4C8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-10" y="12" width="20" height="22" rx="3" fill="#F5F7FA"/>
      <circle cx="-14" cy="0" r="4" fill="#FF6BC1"/>
      <circle cx="14" cy="0" r="4" fill="#FF6BC1"/>
    </g>
    
  
    <line x1="380" y1="260" x2="460" y2="260" stroke="#1D1D26" stroke-width="4" marker-end="url(#arrowhead)"/>
    
  <g transform="translate(470,180)">
    <rect x="0" y="0" width="300" height="150" rx="10" fill="#FFFFFF" stroke="#00D4C8" stroke-width="3"/>
    <text x="150" y="30" font-size="16" text-anchor="middle" fill="#1D1D26" font-weight="700">네이버 연결</text>
    <rect x="20" y="50" width="260" height="28" rx="6" fill="#F5F7FA"/>
    <text x="30" y="69" font-size="13" fill="#1D1D26" opacity="0.7">Client ID</text>
    <rect x="20" y="88" width="260" height="28" rx="6" fill="#F5F7FA"/>
    <text x="30" y="107" font-size="13" fill="#1D1D26" opacity="0.7">Client Secret ••••••</text>
  </g>
  <text x="720.0" y="470" font-size="17" text-anchor="middle" fill="#1D1D26" font-weight="700">이 화면은 네이버 로그인 비밀번호를 입력하는 곳이 아닙니다.</text>


  <rect x="0" y="760" width="1440" height="50" fill="#1D1D26"/>
  <text x="24" y="792" font-size="16" fill="#FFFFFF" font-weight="700">HOMEZ</text>
  <text x="1416" y="792" font-size="14" fill="#B8BEC8" text-anchor="end">공식 API 자격증명만 사용 — 로그인 비밀번호를 입력하지 않습니다</text>
</svg>